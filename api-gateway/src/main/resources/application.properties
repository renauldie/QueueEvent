server.port=8080

spring.application.name=api-gateway

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Route 0: User Service API (Authentication & User Profile)
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}

# Route 1: Event Service API (Events, Reservations, Orders, Analytics)
spring.cloud.gateway.routes[1].id=event-service-route
spring.cloud.gateway.routes[1].uri=${EVENT_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}

# Route 2: User Service Swagger Docs
spring.cloud.gateway.routes[2].id=user-docs-route
spring.cloud.gateway.routes[2].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/v3/api-docs/user-service

# Route 3: Event Service Swagger & OpenAPI Docs
spring.cloud.gateway.routes[3].id=event-docs-route
spring.cloud.gateway.routes[3].uri=${EVENT_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

